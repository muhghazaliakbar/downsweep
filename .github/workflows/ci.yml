name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Test SweepCore
        run: swift test --package-path Packages/SweepCore
      - name: Build app
        run: |
          xcodebuild -project Downsweep.xcodeproj -scheme Downsweep \
            -configuration Debug -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build
