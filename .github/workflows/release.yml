name: Release

# Push a tag like v0.1.0 to build, notarize and publish a DMG.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    env:
      TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      NOTARY_PROFILE: downsweep
      # Signing and publishing need the Developer ID secrets; without them the job only runs the tests
      # (releases are then made locally, see README → Releasing). Optional steps need their own secrets.
      HAS_DEVELOPER_ID: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 != '' }}
      HAS_SPARKLE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY != '' }}
      HAS_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Test SweepCore
        run: swift test --package-path Packages/SweepCore

      - name: Import Developer ID certificate
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          CERTIFICATE_P12: ${{ secrets.DEVELOPER_ID_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.DEVELOPER_ID_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple: -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/certificate.p12"
          echo "NOTARY_KEYCHAIN=$keychain" >> "$GITHUB_ENV"

      - name: Store notary credentials
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$APPLE_ID" --team-id "$TEAM_ID" --password "$APPLE_APP_PASSWORD" \
            --keychain "$NOTARY_KEYCHAIN"

      - name: Build, notarize and staple
        if: env.HAS_DEVELOPER_ID == 'true'
        run: scripts/release.sh "${GITHUB_REF_NAME#v}"

      - name: Sign the update and write the Sparkle appcast
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_SPARKLE_KEY == 'true'
        env:
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
        run: scripts/appcast.sh "${GITHUB_REF_NAME#v}"

      - name: Publish GitHub release
        if: env.HAS_DEVELOPER_ID == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="${GITHUB_REF_NAME#v}"
          assets=("build/release/Downsweep-$version.dmg" "build/release/Downsweep-$version.dmg.sha256")
          # The appcast rides along with each release; the app reads it from releases/latest.
          [[ -f build/release/appcast.xml ]] && assets+=("build/release/appcast.xml")
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" \
            --title "Downsweep $version" --generate-notes

      - name: Update the Homebrew tap
        if: env.HAS_DEVELOPER_ID == 'true' && env.HAS_TAP_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: scripts/update-tap.sh "${GITHUB_REF_NAME#v}"
